name: tictactoe-server
runtime:
  js_entrypoint: "index.js"
  env:
    - "NAKAMA_RUNTIME_ENV=local"
logger:
  level: "INFO"
session:
  token_expiry_sec: 7200
socket:
  max_message_size_bytes: 4096
  max_request_size_bytes: 131072
console:
  username: "admin"
  password: "password"
  signing_key: "tictactoe_console_key_change_in_production"
